<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodWise — Smart Food Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-layout">
    <section class="visual-panel" aria-label="FoodWise introduction">
      <img src="images/foodwise-left-panel.png" alt="FoodWise: Manage your stock. Reduce food waste. Grocery cart illustration.">
    </section>

    <section class="login-panel">
      <div class="leaf leaf-top" aria-hidden="true"></div>
      <div class="leaf leaf-bottom" aria-hidden="true"></div>
      <div class="login-card">
        <header class="card-header">
          <h1>Welcome back</h1>
          <p>Sign in to manage your grocery inventory.</p>
        </header>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
              <input type="email" id="email" placeholder="Enter your email" autocomplete="username" required>
            </div>
          </div>

          <div class="form-group password-group">
            <label for="password">Password</label>
            <div class="password-row">
              <div class="input-wrap password-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v3"></path></svg>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required minlength="6">
              </div>
              <button type="button" id="togglePassword" class="show-button" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <span>Show</span>
              </button>
            </div>
          </div>

          <button type="submit" class="sign-in-button">Sign In</button>
          <p id="message" class="message" role="status" aria-live="polite"></p>
        </form>

        <div class="register-prompt">
          <div class="prompt-divider"><span></span><p>New to FoodWise?</p><span></span></div>
          <p class="register-note">Registration will be added next.</p>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
